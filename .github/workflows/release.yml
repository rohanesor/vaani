name: VAANI Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release-candidate version, for example 0.1.0-rc.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vaani-release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-candidate:
    name: Build unsigned VAANI release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners already provide an Android SDK.
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Validate and package
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/VAANI-${{ inputs.version }}-debug.apk"
          sha256sum "release/VAANI-${{ inputs.version }}-debug.apk" > "release/VAANI-${{ inputs.version }}-debug.apk.sha256"
      - name: Upload release-candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaani-${{ inputs.version }}-debug
          path: release/
          retention-days: 30

# Production signing, GitHub releases, AWS deployment, and provider credentials are deliberately
# absent. They are added only after a reviewed staging architecture and OIDC deployment role exist.
