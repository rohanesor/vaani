name: VAANI CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: vaani-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server contract and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  web:
    name: Canonical web E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Install server dependencies used by the Playwright harness
        run: cd ../server && npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      # The Playwright harness serves client/dist, so build before browser tests.
      - run: npm run build
      - run: npm test
      - name: Upload web failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vaani-web-playwright-artifacts
          path: |
            client/test-results/
            client/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Android compile, tests, package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners already provide an Android SDK. The setup action's
      # legacy `sdkmanager tools` invocation fails with current command-line tools.
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: JVM tests, instrumentation compilation, and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug --no-daemon
      - name: Upload Android reports and debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vaani-android-debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  android-webview-contract:
    name: Android WebView bridge contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci
      - run: cd server && npm ci
      - run: cd client && npx playwright install --with-deps chromium
      - name: Verify canonical token copy and real WebView assets
        run: |
          node scripts/sync-android-webview-tokens.mjs --check
          NODE_PATH="$GITHUB_WORKSPACE/client/node_modules" node tests/android-webview/run.cjs
      - name: Upload WebView harness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vaani-android-webview-contract-artifacts
          path: docs/android-ui/screens/
          if-no-files-found: ignore
          retention-days: 14
